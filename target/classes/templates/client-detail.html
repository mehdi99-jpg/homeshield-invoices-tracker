<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Détail Client</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Détail Client : <span th:text="${client.raisonSociale}">Nom du Client</span></h1>
            <div class="btn-toolbar mb-2 mb-md-0 gap-2">
                <a th:href="@{/clients/{id}/export/excel(id=${client.id})}" class="btn btn-sm btn-outline-success">
                    <i class="fa-solid fa-file-excel me-1"></i> Exporter Excel
                </a>
                <a th:href="@{/clients/{id}/modifier(id=${client.id})}" class="btn btn-sm btn-outline-secondary">
                    <i class="fa-solid fa-pen me-1"></i> Modifier le profil
                </a>
                <a th:href="@{/clients}" class="btn btn-sm btn-outline-dark">
                    <i class="fa-solid fa-arrow-left me-1"></i> Retour
                </a>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <!-- Stats Cards -->
            <div class="col-md-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">Total Facturé</h6>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${#numbers.formatDecimal(totalFacture, 1, 2, 'COMMA')} + ' MAD'">0,00 MAD</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">Total Payé</h6>
                        <h3 class="fw-bold mb-0 text-success" th:text="${#numbers.formatDecimal(totalPaye, 1, 2, 'COMMA')} + ' MAD'">0,00 MAD</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">En Attente</h6>
                        <h3 class="fw-bold mb-0 text-warning" th:text="${#numbers.formatDecimal(totalAttente, 1, 2, 'COMMA')} + ' MAD'">0,00 MAD</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">Nb. Factures</h6>
                        <h3 class="fw-bold mb-0 text-info" th:text="${#lists.size(client.factures)}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Client Info -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0">Informations</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled mb-0">
                            <li class="mb-2"><i class="fa-solid fa-hashtag me-2 text-muted"></i> <span class="fw-bold" th:text="${client.codeClient}"></span></li>
                            <li class="mb-2"><i class="fa-solid fa-building me-2 text-muted"></i> <span th:text="${client.typeClient.libelle}"></span></li>
                            <li class="mb-2"><i class="fa-solid fa-location-dot me-2 text-muted"></i> <span th:text="${client.adresse + ', ' + client.ville}"></span></li>
                            <li class="mb-2"><i class="fa-solid fa-phone me-2 text-muted"></i> <span th:text="${client.telephone}"></span></li>
                            <li class="mb-0"><i class="fa-solid fa-envelope me-2 text-muted"></i> <span th:text="${client.email}"></span></li>
                            <li class="mt-3 pt-3 border-top" th:if="${client.notes}">
                                <small class="text-muted d-block mb-1 text-uppercase fw-bold">Notes</small>
                                <p class="small mb-0" th:text="${client.notes}"></p>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Invoices List -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Historique des Factures</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light small">
                                    <tr>
                                        <th>N°</th>
                                        <th>Date</th>
                                        <th class="text-end">Montant TTC</th>
                                        <th>Statut</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="f : ${client.factures}">
                                        <td class="fw-bold" th:text="${f.numeroFacture}"></td>
                                        <td th:text="${#temporals.format(f.dateProposition, 'dd/MM/yyyy')}"></td>
                                        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(f.totalTTC, 1, 2, 'COMMA')} + ' MAD'">0 MAD</td>
                                        <td>
                                            <div th:replace="~{fragments/badges :: factureStatus(${f.statutFacture})}"></div>
                                        </td>
                                        <td class="text-end">
                                            <a th:href="@{/factures/{id}(id=${f.id})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-eye"></i></a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(client.factures)}">
                                        <td colspan="5" class="text-center py-4 text-muted">Aucune facture pour ce client.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Bons de Livraison</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Gestion des Bons de Livraison</h1>
        </div>

        <!-- Filters -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <form th:action="@{/bons-de-livraison}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Période</label>
                        <div class="input-group input-group-sm">
                            <input type="date" class="form-control" name="start" th:value="${param.start}">
                            <input type="date" class="form-control" name="end" th:value="${param.end}">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Statut</label>
                        <select class="form-select form-select-sm" name="statut">
                            <option value="">Tous</option>
                            <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}" th:selected="${s.name() == param.statut}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-sm btn-secondary w-100">
                            <i class="fa-solid fa-filter me-1"></i> Filtrer
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table -->
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>N° BL</th>
                            <th>Facture</th>
                            <th>Client</th>
                            <th>Date Emission</th>
                            <th>Date Livraison</th>
                            <th>Statut</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="bl : ${bls}">
                            <td class="fw-bold" th:text="${bl.numeroBL}">BL-XX</td>
                            <td>
                                <a th:href="@{/factures/{id}(id=${bl.facture.id})}" th:text="${bl.facture.numeroFacture}" class="text-decoration-none small"></a>
                            </td>
                            <td th:text="${bl.facture.client.raisonSociale}">Client</td>
                            <td th:text="${#temporals.format(bl.dateEmission, 'dd/MM/yyyy')}">Date</td>
                            <td th:text="${bl.dateLivraison != null ? #temporals.format(bl.dateLivraison, 'dd/MM/yyyy') : '-'}">Date</td>
                            <td>
                                <div th:replace="~{fragments/badges :: blStatus(${bl.statutLivraison})}"></div>
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <a th:href="@{/bons-de-livraison/{id}(id=${bl.id})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-eye"></i></a>
                                    <a th:href="@{/bons-de-livraison/{id}/imprimer(id=${bl.id})}" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-print"></i></a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bls)}">
                            <td colspan="7" class="text-center py-4 text-muted">Aucun bon de livraison trouvé.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
